name: Current project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firmware/web/package-lock.json
      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Current files and host tests
        run: |
          python tools/check_project.py
          sh tools/run_host_tests.sh
          python tools/test_flash.py
      - name: Build both current firmwares and Web UI
        run: python tools/build_release.py
      - name: Additional native tests
        working-directory: firmware
        run: pio test -e native
  hardware:
    name: KiCad 10 reproduction
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0.7
      options: --user root
    steps:
      - name: Install git and Python checks
        run: |
          apt-get update -qq
          apt-get install -y -qq git python3-pip >/dev/null
          python3 -m pip install -q --break-system-packages sexpdata==1.0.2
      - uses: actions/checkout@v7.0.1
      - name: Committed CAM matches fresh ERC/DRC and export
        run: python3 tools/verify_cam.py
      - name: Scripts reproduce the committed shield
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          env -u DISPLAY python3 tools/rebuild_shield.py --kicad-python python3 --kicad-cli kicad-cli --no-previews
          python3 tools/compare_shield_rebuild.py
