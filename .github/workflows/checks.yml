name: Current project checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firmware/web/package-lock.json
      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Current files and host tests
        run: |
          python tools/check_project.py
          sh tools/run_host_tests.sh
          python tools/test_flash.py
      - name: Build both current firmwares and Web UI
        run: python tools/build_release.py
      - name: Additional native tests
        working-directory: firmware
        run: pio test -e native
