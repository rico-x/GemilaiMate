name: Wiring page
on:
  push:
    branches: [main]
    paths:
      - docs/wiring.html
      - docs/shield.html
      - docs/shield-wiring.html
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}wiring.html
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Page matches connections.csv and the generator
        run: |
          python3 tools/build_wiring_page.py --check
          python3 tools/build_shield_page.py --check
      - name: Assemble site
        run: |
          mkdir _site
          cp docs/wiring.html _site/wiring.html
          cp docs/shield.html _site/shield.html
          cp docs/shield-wiring.html _site/shield-wiring.html
          cp docs/wiring.html _site/index.html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
