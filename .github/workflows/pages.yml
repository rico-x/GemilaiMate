name: Pages
on:
  push:
    branches: [main]
    paths:
      - docs/wiring.html
      - docs/shield.html
      - docs/shield-wiring.html
      - docs/compact-wiring.html
      - docs/index.html
      - docs/compact.html
      - docs/compact-purchase.html
      - docs/compact-assembly.html
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Pages match connections.csv, hardware data and the generators
        run: |
          python3 tools/build_wiring_page.py --check
          python3 tools/build_shield_page.py --check
          python3 tools/build_compact_pages.py --check
      - name: Assemble site
        run: |
          mkdir _site
          for page in index wiring shield shield-wiring compact compact-wiring compact-purchase compact-assembly; do
            cp "docs/$page.html" "_site/$page.html"
          done
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
